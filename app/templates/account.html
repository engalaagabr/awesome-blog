{% extends "layout.html" %}
{% block body_class %}account-page{% endblock %}
{% block content %}
  <section class="content-section account-settings p-4 mb-4" id="accountPage" aria-labelledby="accountHeading">
    <h1 id="accountHeading" class="account-heading mb-4">Account Settings</h1>
    <p id="accountLoading" class="text-body-secondary" role="status">Loading your profile…</p>
    <div id="accountSignIn" hidden>
      <p class="text-body-secondary">Log in to update your profile and picture.</p>
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
    </div>
    <div id="accountContent" hidden>
      <div class="d-flex align-items-center gap-3 mb-4 account-summary">
        <img id="profileImagePreview" class="rounded-circle account-img flex-shrink-0"
             src="{{ url_for('static', path='profile_pics/default.jpg') }}"
             alt="Your profile picture" width="104" height="104">
        <div class="account-identity">
          <h2 id="profileUsername" class="h5 mb-1 text-break"></h2>
          <p id="profileEmail" class="text-body-secondary mb-0 text-break"></p>
        </div>
      </div>

      <form id="profileForm" aria-labelledby="updateProfileHeading">
        <h2 id="updateProfileHeading" class="h5 mb-2">Update Profile</h2>
        <div class="alert alert-danger" data-form-error role="alert" hidden></div>
        <div class="mb-3">
          <label for="accountUsername" class="form-label">Username</label>
          <input id="accountUsername" class="form-control" name="username" autocomplete="username"
                 minlength="3" maxlength="50" pattern="[a-zA-Z0-9_]+" required>
        </div>
        <div class="mb-3">
          <label for="accountEmail" class="form-label">Email</label>
          <input id="accountEmail" class="form-control" type="email" name="email"
                 autocomplete="email" maxlength="120" required>
        </div>
        <button type="submit" class="btn btn-primary">Update Profile</button>
      </form>

      <hr class="my-4">

      <form id="profileImageForm" enctype="multipart/form-data" aria-labelledby="profilePictureHeading">
        <h2 id="profilePictureHeading" class="h5 mb-2">Profile Picture</h2>
        <p id="profileImageHelp" class="text-body-secondary mb-3">Choose a JPEG, PNG, or WebP image. Maximum 5 MB and 16 megapixels.</p>
        <div class="alert alert-danger" data-form-error role="alert" hidden></div>
        <label for="profileImage" class="visually-hidden">Choose a profile picture</label>
        <input type="file" class="form-control mb-3" id="profileImage" name="image"
               accept="image/jpeg,image/png,image/webp" aria-describedby="profileImageHelp" required>
        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary">Save Picture</button>
          <button type="button" id="resetProfileImage" class="btn btn-outline-secondary" disabled>Use Default Picture</button>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
