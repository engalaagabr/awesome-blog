<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="loginModalLabel">Login</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="loginForm">
        <div class="modal-body">
          <div class="alert alert-info" id="loginNotice" role="status" hidden></div>
          <div class="alert alert-danger" data-form-error role="alert" hidden></div>
          <div class="mb-3">
            <label for="loginUsername" class="form-label">Username</label>
            <input class="form-control" id="loginUsername" name="username" autocomplete="username" minlength="3" maxlength="50" required>
          </div>
          <div class="mb-3">
            <label for="loginPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="loginPassword" name="password" autocomplete="current-password" minlength="4" maxlength="100" required>
          </div>
          <button type="button" class="btn btn-link p-0" data-bs-toggle="modal" data-bs-target="#registerModal">Create an account</button>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="registerModalLabel">Register</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="registerForm">
        <div class="modal-body">
          <div class="alert alert-danger" data-form-error role="alert" hidden></div>
          <div class="mb-3">
            <label for="registerUsername" class="form-label">Username</label>
            <input class="form-control" id="registerUsername" name="username" autocomplete="username" minlength="3" maxlength="50" pattern="[a-zA-Z0-9_]+" aria-describedby="usernameHelp" required>
            <div id="usernameHelp" class="form-text">Use letters, numbers, or underscores.</div>
          </div>
          <div class="mb-3">
            <label for="registerEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="registerEmail" name="email" autocomplete="email" maxlength="120" required>
          </div>
          <div class="mb-3">
            <label for="registerPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="registerPassword" name="password" autocomplete="new-password" minlength="4" maxlength="72" aria-describedby="passwordHelp" required>
            <div id="passwordHelp" class="form-text">Include an uppercase letter, a lowercase letter, and a number. Maximum 72 bytes.</div>
          </div>
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirm_password" autocomplete="new-password" required>
          </div>
          <button type="button" class="btn btn-link p-0" data-bs-toggle="modal" data-bs-target="#loginModal">Already have an account? Login</button>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Register</button>
        </div>
      </form>
    </div>
  </div>
</div>
