<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- Site Info -->
        {% if title %}
            <title>FastAPI Blog - {{ title }}</title>
        {% else %}
            <title>FastAPI Blog</title>
        {% endif %}
        <meta name="description" content="FastAPI Tutorial">
        <meta name="author" content="Corey Schafer">
        <!-- Open Graph Tags: The title of the page for social media sharing. It can match the title tag or be more descriptive. -->
        <meta property="og:title" content="FastAPI Blog">
        <!-- Open Graph Tags: Typically set to "website" for static sites or "article" for content-heavy pages. -->
        <meta property="og:type" content="website">
        <!-- Open Graph Tags: The URL of the page, used to ensure link previews resolve to the correct page. -->
        <meta property="og:url" content="">
        <!-- Open Graph Tags: URL of an image that represents the page. Useful for link previews. -->
        <meta property="og:image" content="">
        <!-- Open Graph Tags: Provides an alternative text for the image to improve accessibility. -->
        <meta property="og:image:alt" content="">
        <!-- Preconnect for Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- Custom Font -->
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
              rel="stylesheet">
        <!-- Bootstrap CSS -->
        <link href="{{ url_for('static', path='css/vendor/bootstrap.min.css') }}"
              rel="stylesheet"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous">
        <!-- Stylesheet -->
        <link rel="stylesheet"
              type="text/css"
              href="{{ url_for("static", path='css/main.css') }}?v=2">
        <!-- Set a theme color that matches your website's primary color -->
        <meta name="theme-color" content="#527c9f">
        <!-- Favicon for all browsers -->
        <link rel="icon"
              href="{{ url_for('static', path='icons/favicon.ico') }}"
              sizes="any">
        <link rel="icon"
              href="{{ url_for('static', path='icons/icon.svg') }}"
              type="image/svg+xml">
        <!-- Apple touch icon for iOS devices -->
        <link rel="apple-touch-icon"
              sizes="180x180"
              href="{{ url_for('static', path='icons/icon.png') }}">
        <!-- Web app manifest for Progressive Web Apps -->
        <link rel="manifest"
              href="{{ url_for('static', path='site.webmanifest') }}">
        <!-- Content Security Policy: Uncomment to enhance security by restricting where content can be loaded from (useful for preventing certain attacks like XSS). Update if adding external sources (e.g., Google Fonts, Bootstrap CDN, analytics, etc). -->
        <!-- <meta http-equiv="Content-Security-Policy"
       content=" default-src 'self'; script-src 'self' code.jquery.com; style-src 'self' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' images.examplecdn.com; "> -->
    </head>
    <body class="d-flex flex-column min-vh-100">
        <header class="site-header">
            <nav class="navbar navbar-expand-md bg-steel fixed-top"
                 data-bs-theme="dark">
                <div class="container">
                    <a class="navbar-brand me-4" href="{{ url_for("home") }}">FastAPI Blog</a>
                    <button class="navbar-toggler"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#navbarToggle"
                            aria-controls="navbarToggle"
                            aria-expanded="false"
                            aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarToggle">
                        <div class="navbar-nav me-auto">
                            <a class="nav-link active"
                               aria-current="page"
                               href="{{ url_for("home") }}">Home</a>
                        </div>
                        <!-- Navbar Right Side -->
                        <div class="navbar-nav">
                            <button class="btn btn-outline-light mb-2 mb-md-0 me-md-2"
                                    type="button" data-new-post>New Post</button>
                            <button class="btn btn-outline-light mb-2 mb-md-0 me-md-2"
                                    type="button" data-guest-only data-bs-toggle="modal"
                                    data-bs-target="#loginModal">Login</button>
                            <button class="btn btn-light mb-2 mb-md-0 me-md-3"
                                    type="button" data-guest-only data-bs-toggle="modal"
                                    data-bs-target="#registerModal">Register</button>
                            <a class="nav-link" data-my-posts data-auth-only hidden>My Posts</a>
                            <span class="navbar-text me-2" id="currentUsername" data-auth-only hidden></span>
                            <button class="btn btn-outline-light mb-2 mb-md-0 me-md-2"
                                    type="button" id="logoutButton" data-auth-only hidden>Logout</button>
                            <div class="nav-item dropdown">
                                <button class="nav-link dropdown-toggle"
                                   type="button"
                                   id="bd-theme"
                                   data-bs-toggle="dropdown"
                                   aria-expanded="false">
                                    <span id="bd-theme-text">🌗 Auto</span>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bd-theme">
                                    <li>
                                        <button class="dropdown-item" type="button" data-bs-theme-value="light">🌝 Light</button>
                                    </li>
                                    <li>
                                        <button class="dropdown-item" type="button" data-bs-theme-value="dark">🌚 Dark</button>
                                    </li>
                                    <li>
                                        <button class="dropdown-item" type="button" data-bs-theme-value="auto">🌗 Auto</button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </header>
        <main role="main" class="container">
            <div id="pageMessage" class="alert" role="status" hidden></div>
            <noscript><div class="alert alert-warning">Enable JavaScript to log in and manage posts.</div></noscript>
            <div class="row">
                <div class="col-md-8">
                    {% block content %}
                    {% endblock content %}
                </div>
                <aside class="col-md-4">
                    <div class="content-section py-3 px-4 mb-4">
                        <h3>Explore</h3>
                        <div class="list-group">
                            <a class="list-group-item list-group-item-action" href="{{ url_for('home') }}">Latest Posts</a>
                            <a class="list-group-item list-group-item-action" data-my-posts data-auth-only hidden>My Posts</a>
                            <button class="list-group-item list-group-item-action" type="button" data-new-post>Write a Post</button>
                        </div>
                    </div>
                </aside>
            </div>
        </main>
        <footer class="mt-auto py-3 bg-body-tertiary border-top">
            <div class="container text-center">
                <p class="text-body-secondary mb-0">
                    © <span id="year"></span> Corey Schafer
                </p>
            </div>
        </footer>
        <!-- Create Post Modal -->
        <div class="modal fade"
             id="createPostModal"
             tabindex="-1"
             aria-labelledby="createPostModalLabel"
             aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="createPostModalLabel">New Post</h5>
                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="Close"></button>
                    </div>
                    <form id="createPostForm">
                        <div class="modal-body">
                            <div class="alert alert-danger" data-form-error role="alert" hidden></div>
                            <div class="mb-3">
                                <label for="title" class="form-label">Title</label>
                                <input type="text" class="form-control" id="title" name="title" maxlength="100" required>
                            </div>
                            <div class="mb-3">
                                <label for="content" class="form-label">Content</label>
                                <textarea class="form-control" id="content" name="content" rows="5" required></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button"
                                    class="btn btn-outline-secondary"
                                    data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Post</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        {% include "auth_modals.html" %}
        <!-- Success Modal -->
        <div class="modal fade"
             id="successModal"
             tabindex="-1"
             aria-labelledby="successModalLabel"
             aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title" id="successModalLabel">Success</h5>
                        <button type="button"
                                class="btn-close btn-close-white"
                                data-bs-dismiss="modal"
                                aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p id="successMessage" class="fs-5"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Error Modal -->
        <div class="modal fade"
             id="errorModal"
             tabindex="-1"
             aria-labelledby="errorModalLabel"
             aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title" id="errorModalLabel">Error</h5>
                        <button type="button"
                                class="btn-close btn-close-white"
                                data-bs-dismiss="modal"
                                aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p id="errorMessage" class="fs-5"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Set the current year in the footer -->
        <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
        <!-- Bootstrap Bundle with Popper -->
        <script src="{{ url_for('static', path='js/vendor/bootstrap.bundle.min.js') }}"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>
        <!-- Dark Mode Toggle -->
        <script>
      const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');
      let activeTheme = 'auto';
      const setTheme = (theme) => {
        activeTheme = theme;
        if (theme === 'auto') {
          document.documentElement.setAttribute('data-bs-theme', 
            colorScheme.matches ? 'dark' : 'light');
        } else {
          document.documentElement.setAttribute('data-bs-theme', theme);
        }
        try { localStorage.setItem('theme', theme); } catch {}
        
        // Update button text
        const themeText = { light: '🌝 Light', dark: '🌚 Dark', auto: '🌗 Auto' };
        document.getElementById('bd-theme-text').textContent = themeText[theme];
      };

      // Set theme on click
      document.querySelectorAll('[data-bs-theme-value]').forEach(button => {
        button.addEventListener('click', () => setTheme(button.getAttribute('data-bs-theme-value')));
      });

      // Initialize
      let savedTheme = 'auto';
      try { savedTheme = localStorage.getItem('theme') || 'auto'; } catch {}
      setTheme(['light', 'dark', 'auto'].includes(savedTheme) ? savedTheme : 'auto');
      colorScheme.addEventListener('change', () => {
        if (activeTheme === 'auto') setTheme('auto');
      });
        </script>
        <script type="module" src="{{ url_for('static', path='js/app.js') }}?v=1"></script>
        {% block scripts %}
        {% endblock scripts %}
    </body>
</html>
