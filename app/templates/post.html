{% extends "layout.html" %}
{% block content %}
  <article class="content-section py-3 px-4 mb-4" id="postDetail" data-post-id="{{ post.id }}" data-author-id="{{ post.user_id }}">
    <div class="d-flex align-items-start gap-4">
      <img class="rounded-circle article-img flex-shrink-0"
           src="{{ post.author.image_path }}" data-profile-user-id="{{ post.author.id }}"
           alt="{{ post.author.username }}'s profile picture"
           width="64"
           height="64"
           loading="lazy">
      <div class="flex-grow-1">
        <div class="article-metadata mb-2">
          <a class="me-2" href="{{ url_for('user_posts', user_id=post.user_id) }}">{{ post.author.username }}</a>
          <small class="text-body-secondary">{{ post.date_posted }}</small>
        </div>
        <h2 class="article-title">{{ post.title }}</h2>
        <p class="article-content">{{ post.content }}</p>
        <section class="post-engagement mt-3 pt-3 border-top"
                 id="postEngagement" aria-label="Likes and comments">
          <div class="d-flex align-items-center gap-3 mb-3">
            <button type="button" id="likePostButton" class="btn btn-outline-primary"
                    aria-pressed="false" disabled>Like</button>
            <span id="likeCount" class="text-body-secondary" aria-live="polite">Loading likes…</span>
          </div>
          <h3 class="h5">Comments <span id="commentCount" class="text-body-secondary"></span></h3>
          <p id="commentStatus" class="text-body-secondary" role="status"></p>
          <ul id="commentList" class="list-unstyled" aria-live="polite"></ul>
          <button type="button" id="moreComments" class="btn btn-outline-secondary mb-3" hidden>
            Load more comments
          </button>
          <form id="commentForm" class="mb-3" data-auth-only hidden>
            <label for="commentContent" class="form-label">Add a comment</label>
            <textarea class="form-control mb-2" id="commentContent" name="content"
                      rows="3" maxlength="2000" required></textarea>
            <div class="alert alert-danger" data-form-error role="alert" hidden></div>
            <button type="submit" class="btn btn-primary">Comment</button>
          </form>
          <p id="commentSignIn" class="text-body-secondary" data-guest-only>
            <button type="button" class="btn btn-link p-0" data-engagement-login>
              Log in to like and comment.
            </button>
          </p>
        </section>
        <div class="post-actions mt-3 pt-3 border-top" id="postActions" hidden>
          <button type="button" class="btn btn-outline-secondary me-1"
                  data-bs-toggle="modal" data-bs-target="#editPostModal">Edit Post</button>
          <button type="button"
                  class="btn btn-outline-danger"
                  data-bs-toggle="modal"
                  data-bs-target="#deleteModal">Delete Post</button>
        </div>
      </div>
    </div>
  </article>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade"
       id="deleteModal"
       tabindex="-1"
       aria-labelledby="deleteModalLabel"
       aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteModalLabel">Delete Post?</h5>
          <button type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"></button>
        </div>
        <form id="deletePostForm">
          <div class="modal-body">
            <div class="alert alert-danger" data-form-error role="alert" hidden></div>
            Are you sure you want to delete this post? This action cannot be undone.
          </div>
          <div class="modal-footer">
            <button type="button"
                    class="btn btn-outline-secondary"
                    data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-outline-danger">Delete</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="modal fade" id="editPostModal" tabindex="-1" aria-labelledby="editPostModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editPostModalLabel">Edit Post</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="editPostForm">
          <div class="modal-body">
            <div class="alert alert-danger" data-form-error role="alert" hidden></div>
            <div class="mb-3">
              <label for="editTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="editTitle" name="title" maxlength="100" value="{{ post.title }}" required>
            </div>
            <div class="mb-3">
              <label for="editContent" class="form-label">Content</label>
              <textarea class="form-control" id="editContent" name="content" rows="5" required>{{ post.content }}</textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock content %}
