services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${BLOG_PORT:-8082}:8000"
    environment:
      DATABASE_URL: "${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env before starting Compose}"
    volumes:
      - blog_data:/data
      - blog_media:/app/app/media
    init: true
    restart: unless-stopped

volumes:
  blog_data:
  blog_media:
